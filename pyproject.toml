[project]
name = "airman-social-bot"
version = "0.1.0"
description = "AIRMAN Social Media Automation Bot"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]",
    "instagrapi",
    "python-dotenv",
    "httpx",
    "feedparser",
    "Pillow",
    "google-genai",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"